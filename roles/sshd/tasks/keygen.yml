---
- name: Create the ssh directory of {{ sshd_user }}
  ansible.builtin.file:
    path: "{{ __sshd_home }}/.ssh"
    state: directory
    owner: "{{ sshd_user }}"
    group: "{{ sshd_group }}"
    mode: "0700"
  become: true

# openssh_keypair is idempotent: an existing key of the same type is left alone,
# so this does not overwrite a key that is already in an authorized_keys
# somewhere.
- name: Generate the ed25519 key pair for {{ sshd_user }}
  community.crypto.openssh_keypair:
    path: "{{ __sshd_home }}/.ssh/{{ sshd_keyfile }}"
    type: ed25519
    owner: "{{ sshd_user }}"
    group: "{{ sshd_group }}"
    mode: "0600"
  become: true
  register: __sshd_keypair

# Exposed so a playbook can hand the key to a forge without reading the file
# from a foreign role's path.
- name: Report the public key of {{ sshd_user }}
  ansible.builtin.set_fact:
    sshd_public_key: "{{ __sshd_keypair.public_key }}"
