---
- name: Make shure ssh config folder is in place
  ansible.builtin.file: 
    path: "/home/{{ sshd_user.name }}/.ssh"
    owner: "{{ sshd_user.name }}"
    group: "{{ sshd_user.group }}"
    mode: "0700"
    state: directory

# generates keys for user
- name: Generate ssh keypair
  community.crypto.openssh_keypair:
    path: /home/{{ sshd_user.name }}/.ssh/{{ sshd_keyfile }}
    owner: "{{ sshd_user.name }}"
    group: "{{ sshd_user.group }}"
    type: ed25519
    mode: "0600"
  register: __sshd_keygen
  become: true

- name: Get ssh public key
  ansible.builtin.set_fact:
    ssh_public_key: "{{ lookup('file', '/home/'+ git_user + '/.ssh/id_ed25519.pub')}}"