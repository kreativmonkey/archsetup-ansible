---
- name: Install required packages
  ansible.builtin.package:
    name:
      - openssh
    state: present
  become: true

- name: Generate ssh_key
  ansible.builtin.include_tasks: keygen.yml

# add ssh-key with ssh-add

- name: Activate ssh agent
  ansible.builtin.systemd_service:
    name: ssh-agent
    scope: "{{ sshd_user.name }}"
