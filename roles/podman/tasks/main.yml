---
# tasks file for podman

- name: Install podman
  community.general.pacman:
    name: podman
    state: present
  become: true

- name: Replace docker with podman
  ansible.builtin.include_tasks: __configure/replace_docker.yml
  when: podman_replace_docker

# Only meaningful next to an installed cockpit, so the role asks the package
# database instead of guessing.
- name: Gather the package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Install the cockpit extension for podman
  community.general.pacman:
    name: cockpit-podman
    state: present
  become: true
  when: "'cockpit' in ansible_facts.packages"

- name: Set up rootless containers
  ansible.builtin.include_tasks: __configure/rootless.yml
  when: podman_rootless
