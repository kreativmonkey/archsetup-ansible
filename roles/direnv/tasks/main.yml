---
# tasks file for direnv

- name: Install direnv
  community.general.pacman:
    name: direnv
    state: present
  become: true

- name: Create the nix-direnv directory
  ansible.builtin.file:
    path: "{{ __direnv_nix_direnv_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: direnv_nix_direnv

# Pinned to a version rather than a branch: an unpinned direnvrc changes the
# behaviour of every dev shell on the host without a commit anywhere.
- name: Install the nix-direnv direnvrc from upstream
  ansible.builtin.get_url:
    url: >-
      https://raw.githubusercontent.com/nix-community/nix-direnv/{{
        direnv_nix_direnv_version }}/direnvrc
    dest: "{{ __direnv_nix_direnv_path }}/direnvrc"
    owner: root
    group: root
    mode: "0644"
  become: true
  when: direnv_nix_direnv

- name: Configure direnv for the users
  ansible.builtin.include_tasks: __configure/user.yml
  loop_control:
    loop_var: __direnv_user
  loop: "{{ direnv_users }}"
