---
# vars file for direnv

# Where the upstream direnvrc lands. Outside any user's home, because every
# user's direnvrc sources this one file.
__direnv_nix_direnv_path: /usr/share/nix-direnv

# Header for the two files this role writes with `copy: content:`.
#
# Not `ansible_managed | comment`: that variable is injected into the render
# context of the template module only. In a task argument it is simply
# undefined, and the task fails before it runs.
__direnv_managed_header: "# Managed by ansible (roles/direnv) — local changes are overwritten."
