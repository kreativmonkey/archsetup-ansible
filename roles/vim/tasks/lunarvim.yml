---
# LunarVim ships no plain config repo; upstream only supports its installer.
# We install the runtime dependencies via pacman beforehand and let the
# installer set up the ~/.config/lvim config and the `lvim` launcher.

- name: Install LunarVim via upstream installer
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      curl -fsSL
      https://raw.githubusercontent.com/LunarVim/LunarVim/{{ vim_lunarvim_branch }}/utils/installer/install.sh
      | bash -s -- --no-install-dependencies --yes
    creates: "{{ vim_home }}/.local/bin/lvim"
    executable: /bin/bash
  become: true
  become_user: "{{ vim_user }}"
  environment:
    HOME: "{{ vim_home }}"
    LV_BRANCH: "{{ vim_lunarvim_branch }}"
