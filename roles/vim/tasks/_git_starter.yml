---
# Shared install flow for the git-clone based distributions
# (astronvim, lazyvim, nvchad). Clones the starter template into
# ~/.config/nvim, hands it to the target user and drops the upstream .git so
# the config becomes the user's own.

- name: Clone {{ vim_distro }} starter
  ansible.builtin.git:
    repo: "{{ vim_repos[vim_distro] }}"
    dest: "{{ vim_config_path }}"
    depth: 1
    single_branch: true
  become: true
  become_user: "{{ vim_user }}"

- name: Remove upstream .git directory from {{ vim_distro }}
  ansible.builtin.file:
    path: "{{ vim_config_path }}/.git"
    state: absent
  become: true
