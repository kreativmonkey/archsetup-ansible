---
# vars file for vim

__vim_home: "/home/{{ vim_user }}"
__vim_config_path: "{{ __vim_home }}/.config/nvim"

# Where an existing configuration is moved before it is replaced. Replaced on
# every rebuild, so it holds the state from immediately before the last one.
__vim_backup_path: "{{ __vim_config_path }}.back"

# Records which distribution the role installed. This is what makes the role
# idempotent: without it the role cannot tell an already installed distribution
# from a switch, and rebuilds on every run.
#
# It lives inside the config directory on purpose, so its lifetime is that of
# the configuration it describes — remove ~/.config/nvim by hand and the role
# reinstalls on the next run.
__vim_state_file: "{{ __vim_config_path }}/.ansible_vim_distro"

# Accepted values for vim_distro.
__vim_valid_distros:
  - astronvim
  - lazyvim

# Config-starter repositories for the git-clone based distributions.
__vim_repos:
  astronvim: https://github.com/AstroNvim/template
  lazyvim: https://github.com/LazyVim/starter

# Every distribution-related path that gets removed before installing the
# selected distribution. This is what guarantees that only one distribution is
# ever present and that switching cleanly deactivates the previous one.
__vim_cleanup_paths:
  # git-clone distros
  - "{{ __vim_home }}/.config/nvim"
  # legacy LunarVim install (no longer supported; cleaned up on migration)
  - "{{ __vim_home }}/.config/lvim"
  - "{{ __vim_home }}/.local/share/lunarvim"
  - "{{ __vim_home }}/.local/state/lvim"
  - "{{ __vim_home }}/.cache/lvim"
  - "{{ __vim_home }}/.local/bin/lvim"
  # legacy SpaceVim install (no longer supported; cleaned up on migration)
  - "{{ __vim_home }}/.SpaceVim"
  - "{{ __vim_home }}/.SpaceVim.d"
  - "{{ __vim_home }}/.config/nvim_back"
  # shared Neovim runtime state
  - "{{ __vim_home }}/.local/share/nvim"
  - "{{ __vim_home }}/.local/state/nvim"
  - "{{ __vim_home }}/.cache/nvim"

# Optional dependencies, all from the official Arch repositories (no AUR).
# These cover the tooling the supported distributions detect and use:
# treesitter/LSP builds, fuzzy finding, git integration, clipboard, fonts and
# image previews.
__vim_dependencies:
  # core
  - neovim
  - git
  - curl
  - wget
  - unzip
  - tar
  - gzip
  # search / navigation / git ui
  - ripgrep
  - fd
  - fzf
  - lazygit
  # treesitter + build toolchain for parsers/plugins
  - tree-sitter-cli
  - gcc
  - make
  # language runtimes used by plugins / mason-less installs
  # nodejs is handled separately (see vim_nodejs_package) so an already
  # installed provider such as nodejs-lts-* is not force-replaced.
  - npm
  - python
  - python-pynvim
  - go
  - rust
  # clipboard providers (X11 + Wayland)
  - xclip
  - wl-clipboard
  # nerd fonts / icons
  - ttf-nerd-fonts-symbols
  - ttf-nerd-fonts-symbols-mono
  - otf-monaspace-nerdfonts
  # language servers available in the official repos
  - lua-language-server
  - bash-language-server
  - yaml-language-server
  # nice-to-haves several distros integrate with
  - bat
  - git-delta
  - imagemagick
  - chafa
