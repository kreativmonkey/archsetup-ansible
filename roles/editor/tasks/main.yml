---
# tasks file for editor

- name: Install the default editor
  community.general.pacman:
    name: "{{ editor_default }}"
    state: present
  become: true

# /etc/environment is a plain KEY=value file read by pam_env, shared with the
# distribution and the user — hence a managed line per variable rather than a
# template. The regexp targets the active assignment, never a comment.
- name: Set EDITOR for every login session
  ansible.builtin.lineinfile:
    path: "{{ __editor_environment_file }}"
    regexp: '^\s*EDITOR\s*='
    line: "EDITOR={{ __editor_command }}"
    insertafter: EOF
    create: true
    state: present
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Set VISUAL for every login session
  ansible.builtin.lineinfile:
    path: "{{ __editor_environment_file }}"
    regexp: '^\s*VISUAL\s*='
    line: "VISUAL={{ __editor_command }}"
    insertafter: EOF
    create: true
    state: present
    owner: root
    group: root
    mode: "0644"
  become: true
  when: editor_set_visual

- name: Apply the extra setup for {{ editor_default }}
  ansible.builtin.include_tasks: "__configure/{{ editor_default }}.yml"
  when: editor_default in __editor_configurable
