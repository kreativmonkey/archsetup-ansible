---
- name: Check if Opencode config exists
  ansible.builtin.stat:
    path: "/home/{{ headroom_user }}/.config/opencode/opencode.json"
  register: opencode_config

- name: Inject Headroom provider into Opencode config
  ansible.builtin.replace:
    path: "/home/{{ headroom_user }}/.config/opencode/opencode.json"
    regexp: '"provider":\s*\{'
    replace: |
      "provider": {
          "headroom": {
            "npm": "@ai-sdk/openai-compatible",
            "name": "Headroom (via local proxy)",
            "options": {
              "baseURL": "http://localhost:{{ headroom_port }}/v1",
              "maxOutputTokens": 4096
            },
            "models": {
              "gpt-4o": {
                "name": "GPT-4o (Headroom)"
              },
              "claude-3-5-sonnet-latest": {
                "name": "Claude 3.5 Sonnet (Headroom)"
              }
            }
          },
  when: 
    - opencode_config.stat.exists
    - lookup('file', '/home/' + headroom_user + '/.config/opencode/opencode.json') is not search('headroom')

- name: Inject Headroom MCP server into Opencode config
  ansible.builtin.replace:
    path: "/home/{{ headroom_user }}/.config/opencode/opencode.json"
    regexp: '"mcp":\s*\{'
    replace: |
      "mcp": {
          "headroom": {
            "type": "local",
            "command": [
              "/home/{{ headroom_user }}/.local/bin/headroom",
              "mcp",
              "start"
            ],
            "enabled": true
          },
  when:
    - opencode_config.stat.exists
    - "lookup('file', '/home/' + headroom_user + '/.config/opencode/opencode.json') is not search('\"headroom\": {') or lookup('file', '/home/' + headroom_user + '/.config/opencode/opencode.json') is not search('\"mcp\":')"
