---
- name: Ensure global .cursorrules with RTK instructions
  ansible.builtin.blockinfile:
    path: "/home/{{ headroom_user }}/.cursorrules"
    create: true
    owner: "{{ headroom_user }}"
    group: "{{ headroom_user }}"
    mode: '0644'
    marker: "<!-- {mark} headroom:rtk-instructions -->"
    block: |
      # RTK (Rust Token Killer) - Token-Optimized Commands

      When running shell commands, **always prefix with `rtk`**. This reduces context
      usage by 60-90% with zero behavior change.

      ## Key Commands
      ```bash
      rtk git status          rtk git diff            rtk git log
      rtk ls <path>           rtk read <file>         rtk grep <pattern>
      rtk find <pattern>      rtk diff <file>
      rtk pytest tests/       rtk cargo test          rtk test <cmd>
      ```
      (Instructions shortened for brevity, Headroom will expand these on first use)
