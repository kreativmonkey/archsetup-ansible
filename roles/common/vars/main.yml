---
# vars file for common

# The base package set of this workstation. Internal on purpose: the set is
# what the role *is*, and it is not meant to be replaced from the outside.
# Additions go through common_custom_packages.
__common_packages:
  # editors
  - helix
  - neovim
  # terminal helpers
  - eza
  - yazi
  - htop
  - btop
  - tree
  - tmux
  - unzip
  - mosh
  - lsd
  - fzf
  - bat
  - duf
  - git-delta
  - jujutsu
  - lazyjj
  - fd
  - zoxide
  - mcfly
  - ripgrep
  - direnv
  # backup and restore
  - chezmoi
  - restic
  - vorta
  - seahorse
  - rsync
  # networking
  - nmap
  - tcpdump
  # virtualisation
  - virt-viewer
  # office
  - evolution
  - xournalpp
  - nextcloud-client
  - libreoffice-fresh
  # fonts
  - ttf-roboto
  # spell checking
  - hunspell
  - hunspell-de
  - hunspell-en_us

# Only in the AUR, so out of reach for community.general.pacman. Listed here so
# the gap is visible instead of hidden in a commented-out line:
#   visual-studio-code-bin, cheat, ventoy, libreoffice-fresh-de
