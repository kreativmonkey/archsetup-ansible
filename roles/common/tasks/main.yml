---
# tasks file for common

# One transaction instead of one per package: pacman resolves the whole set at
# once, which is both faster and what makes a second run report no change.
- name: Install the base package set
  community.general.pacman:
    name: "{{ __common_packages }}"
    state: present
  become: true

- name: Install the additional packages of this host
  community.general.pacman:
    name: "{{ common_custom_packages }}"
    state: present
  become: true
  when: common_custom_packages | length > 0
