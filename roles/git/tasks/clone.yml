---
# Entry point: clone one repository into <git_base.dir>/<forge>/<name>. The
# forge directory is derived from the URL, so a clone lands where the includeIf
# patterns of the global config expect it and picks up the right identity.

- name: Create the forge directory for {{ __git_repo_domain }}
  ansible.builtin.file:
    path: "{{ git_base.dir }}/{{ __git_repo_domain }}"
    state: directory
    owner: "{{ git_base.owner }}"
    group: "{{ git_base.group }}"
    mode: "0755"
  become: true

# update: false — this clones what is missing and then leaves the checkout
# alone. Pulling somebody's working tree from a config run is not this role's
# business.
- name: Clone the repository {{ git_repository }}
  ansible.builtin.git:
    repo: "{{ git_repository }}"
    dest: "{{ git_base.dir }}/{{ __git_repo_domain }}/{{ __git_repo_name }}"
    version: "{{ git_repository_version }}"
    accept_hostkey: true
    update: false
  become: true
  become_user: "{{ git_base.owner }}"
