---
# tasks file for git
- name: Installing git
  ansible.builtin.package:
    name: git
    state: present

- name: Installing lazygit as terminal helper
  ansible.builtin.package:
    name: lazygit
    state: present
  become: true

- name: Create git project directory structure
  ansible.builtin.file:
    path: "{{ git_base.dir }}/{{ git_folder }}"
    owner: "{{ git_base.owner }}"
    group: "{{ git_base.group }}"
    mode: "0755"
    state: directory
    recurse: true
  become: true
  loop_control:
    loop_var: git_folder
  loop: "{{ git_identities | map(attribute='folder') }}"

- name: Create configuration files for the different project folders
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "{{ git_base.dir }}/{{ git_identity.folder }}/.gitconfig"
    mode: "0644"
    owner: "{{ git_base.owner }}"
    group: "{{ git_base.group }}"
  loop_control:
    loop_var: git_identity
    label: "{{ git_identity.folder }}"
  loop: "{{ git_identities }}"

# Without this the per-folder files above are dead weight: git only reads the
# system, global and repository config — never a .gitconfig in a parent folder.
- name: Create the global git configuration with sane defaults
  ansible.builtin.template:
    src: gitconfig_global.j2
    dest: "{{ git_global_config }}"
    mode: "0644"
    owner: "{{ git_base.owner }}"
    group: "{{ git_base.group }}"
    backup: true

- name: Create the XDG config directory for git
  ansible.builtin.file:
    path: "/home/{{ git_user }}/.config/git"
    state: directory
    mode: "0755"
    owner: "{{ git_base.owner }}"
    group: "{{ git_base.group }}"
  when: git_global_ignore_manage

- name: Create the global gitignore
  ansible.builtin.template:
    src: gitignore.j2
    dest: "/home/{{ git_user }}/.config/git/ignore"
    mode: "0644"
    owner: "{{ git_base.owner }}"
    group: "{{ git_base.group }}"
    backup: true
  when: git_global_ignore_manage

