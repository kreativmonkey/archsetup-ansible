---
argument_specs:
  main:
    short_description: Manage the global git configuration and the project tree
    description:
      - >-
        Installs git and lazygit, lays out ~/git/<forge>/ and writes the global
        git configuration with one identity per forge folder, wired up with
        includeIf.
      - >-
        Central role for the git configuration. It also clones the declared
        repositories and hands the ssh_config stanzas the forges need to the
        C(sshd) role.
    options:
      git_user:
        type: str
        required: false
        description:
          - User the configuration is written for.
      git_base:
        type: dict
        required: false
        description:
          - Root of the project tree and its ownership.
        options:
          dir:
            type: str
            required: true
            description: Root directory, one subdirectory per forge.
          owner:
            type: str
            required: true
            description: Owner of the tree and of the clones.
          group:
            type: str
            required: true
            description: Group of the tree.
      git_identities:
        type: list
        elements: dict
        required: false
        default: []
        description:
          - >-
            One identity per forge folder. Each gets a .gitconfig in its folder
            and an includeIf in the global config.
        options:
          folder:
            type: str
            required: true
            description:
              - >-
                Directory below C(git_base.dir), conventionally the forge host
                name.
          name:
            type: str
            required: true
            description: Committer name.
          email:
            type: str
            required: true
            description: Committer email.
          ssh_key:
            type: str
            required: false
            description:
              - Key used for this folder, via core.sshCommand and IdentitiesOnly.
          signing_key:
            type: str
            required: false
            description:
              - >-
                Signing key. Enables commit.gpgsign and tag.gpgsign for this
                folder only.
          signing_format:
            type: str
            required: false
            default: ssh
            description: Value of gpg.format.
          settings:
            type: dict
            required: false
            description:
              - Additional settings, same shape as C(git_settings).
      git_global_config:
        type: str
        required: false
        description:
          - >-
            Path of the managed global config. Keep it at ~/.gitconfig unless
            you also delete that file — git reads XDG *and* ~/.gitconfig, and
            the latter wins.
      git_default_identity:
        type: dict
        required: false
        description:
          - >-
            Identity for repositories no includeIf matches. Defaults to the
            first entry of C(git_identities).
      git_user_config_only:
        type: bool
        required: false
        default: false
        description:
          - >-
            Abort a commit instead of guessing an identity. Only meaningful with
            an empty C(git_default_identity).
      git_settings:
        type: dict
        required: false
        description:
          - Global settings as a C(section -> key -> value) dict.
      git_settings_extra:
        type: dict
        required: false
        default: {}
        description:
          - >-
            Recursively merged over C(git_settings). Use this from the inventory
            instead of restating the whole dict.
      git_aliases:
        type: dict
        required: false
        description:
          - Aliases as a C(name -> command) dict.
      git_global_ignore_manage:
        type: bool
        required: false
        default: true
        description:
          - Manage ~/.config/git/ignore.
      git_global_ignore:
        type: list
        elements: str
        required: false
        description:
          - >-
            Global ignore patterns. Machine-local noise only — build artefacts
            belong in the repository's own .gitignore.
      git_repositories:
        type: list
        elements: str
        required: false
        default: []
        description:
          - Clone URLs, in the shape C(clone) expects.
      git_repository_version:
        type: str
        required: false
        default: HEAD
        description:
          - Branch or tag a clone is checked out at.
      git_ssh_hosts:
        type: list
        elements: dict
        required: false
        default: []
        description:
          - >-
            ssh_config stanzas handed to the C(sshd) role, in the shape its
            C(add_host) entry point expects.

  clone:
    short_description: Clone a single repository into the project tree
    description:
      - >-
        The forge directory is derived from the URL, so the clone lands where
        the includeIf patterns expect it and picks up the right identity.
      - >-
        Clones what is missing and leaves an existing checkout alone. Accepts
        https, ssh:// and scp-style URLs.
    options:
      git_repository:
        type: str
        required: true
        description:
          - Clone URL.
      git_repository_version:
        type: str
        required: false
        default: HEAD
        description:
          - Branch or tag to check out.
      git_base:
        type: dict
        required: false
        description:
          - Root of the project tree and its ownership.

  checkout:
    short_description: Check out a repository at a given path and owner
    description:
      - >-
        Entry point for roles that need a working copy outside the project tree
        — a fixed path, a different owner, and a checkout that follows its
        remote. Never call C(ansible.builtin.git) outside this role.
      - >-
        Distinct from C(clone) on purpose: C(clone) derives the path from the URL
        so the includeIf identities match and leaves an existing checkout alone,
        while C(checkout) puts the tree exactly where the caller says and updates
        it.
    options:
      git_checkout:
        type: dict
        required: true
        description:
          - The working copy to establish.
        options:
          repo:
            type: str
            required: true
            description: Clone URL.
          dest:
            type: str
            required: true
            description: Absolute path of the working copy.
          version:
            type: str
            required: false
            default: HEAD
            description: Branch, tag or commit to check out.
          owner:
            type: str
            required: false
            default: root
            description:
              - >-
                Account the checkout runs as and belongs to. It needs write
                access to the parent of C(dest).
          group:
            type: str
            required: false
            description: Group of the top directory, defaults to C(owner).
          mode:
            type: str
            required: false
            description:
              - >-
                Mode of the top directory. Set it when the repository carries
                secrets — the git module creates the tree under the caller's
                umask, so restricting the top directory is what keeps the
                contents out of reach.
          key_file:
            type: str
            required: false
            description:
              - >-
                SSH private key for the fetch. Needed whenever C(owner) has no
                key of its own for the forge, which is the normal case for root.
                It must not be passphrase protected — there is nothing to unlock
                it with.
          accept_hostkey:
            type: bool
            required: false
            default: true
            description:
              - >-
                Add an unknown host key instead of failing. C(owner) usually has
                no known_hosts entry for the forge.
          pull:
            type: bool
            required: false
            default: true
            description:
              - >-
                Fetch and fast-forward an existing checkout. False makes this
                behave like C(clone) and only create what is missing.
              - >-
                Named C(pull) and not C(update) on purpose: a key named after a
                dict method resolves to that method in a template, and no
                C(default) can catch it.
          force:
            type: bool
            required: false
            default: false
            description:
              - >-
                Discard local modifications on update. Leave it off unless the
                working copy is disposable.
