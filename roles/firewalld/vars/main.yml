---
# vars file for firewalld

# Accepted values for IPv6_rpfilter, per firewalld.conf(5).
__firewalld_ipv6_rpfilter_values:
  - strict
  - loose
  - strict-forward
  - loose-forward
  - "no"

# The rule the structural check looks for in filter_PREROUTING.
__firewalld_rpf_rule: 'fib saddr .* check missing.*drop'
