---
# Package to install (ollama-cuda, ollama-rocm, ollama-vulkan, or just ollama)
ollama_acceleration_package: ollama-rocm

# Models to pull automatically
ollama_models:
  - gemma4:e4b
  - qwen3-coder:30b
  # - mistral-small:24b
  # - llama4:scout

# Environment variables for the ollama service
ollama_environment_variables:
  OLLAMA_HOST: "0.0.0.0"
  OLLAMA_FLASH_ATTENTION: "1"        # Enables Flash Attention for faster inference
  OLLAMA_JINJA: "1"                  # Enables Jinja templates for advanced tool calling
  OLLAMA_NUM_PARALLEL: "1"           # Focus all resources on a single request for speed
  OLLAMA_MAX_LOADED_MODELS: "1"      # Keep only one model in VRAM for maximum performance
  OLLAMA_KV_CACHE_TYPE: "q4_0"       # Use q4_0 to reduce memory bandwidth pressure on APU
  OLLAMA_NOPREFIX: "1"               # Optimization for some backends
  HSA_OVERRIDE_GFX_VERSION: "11.0.0" # Required for Radeon 890M (gfx1150) to enable ROCm
  OLLAMA_NUM_GPU: "999"              # Force offloading all layers to GPU

# Model specific overrides (Modelfiles)
ollama_model_customizations:
  - name: "gemma4:latest"
    from: "gemma4:e4b"
    parameters:
      num_ctx: 32768
    system: "You are a helpful AI assistant. Respond directly. DO NOT use thinking tags."

  - name: "qwen3-coder:latest"
    from: "qwen3-coder:30b"
    parameters:
      num_ctx: 65536
      temperature: 0.1
    system: "You are an expert coding agent. Use tool-calls for any action. Reason step-by-step before calling tools."

  #  - name: "mistral-small:latest"
  #    from: "mistral-small:24b"
  #    parameters:
  #      num_ctx: 32768
  #      temperature: 0.2
  #    system: "You are a high-precision agent. Follow tool-call schemas strictly. Be concise and technical."
