---
# tasks file for ollama

- name: Install ollama and the acceleration packages
  community.general.pacman:
    name: "{{ __ollama_packages }}"
    state: present
  become: true

# The service account is created by the package. It needs render and video to
# reach /dev/dri and /dev/kfd — without them ollama silently falls back to CPU
# inference, which looks like "the model is just slow".
- name: Grant the ollama service account GPU access
  ansible.builtin.include_role:
    name: system_user
    tasks_from: add_to_group
  vars:
    system_user_membership:
      name: ollama
      groups:
        - render
        - video
      create_groups: false

- name: Create the systemd override directory
  ansible.builtin.file:
    path: "{{ __ollama_override_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

# A drop-in, not an edit of the shipped unit: pacman keeps updating
# ollama.service and would take the settings with it.
- name: Configure the ollama environment
  ansible.builtin.template:
    src: override.conf.j2
    dest: "{{ __ollama_override_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart ollama

- name: Start the ollama service
  ansible.builtin.systemd_service:
    name: ollama
    state: started
    enabled: true
    daemon_reload: true
  become: true

# The pulls and the model customisations below talk to the running service, so
# a pending restart has to have happened first.
- name: Apply a pending ollama restart
  ansible.builtin.meta: flush_handlers

- name: Manage the models
  ansible.builtin.include_tasks: __models/manage.yml
