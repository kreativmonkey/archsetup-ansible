---
# handlers file for pacman

# A newly enabled repository has no package list yet, so the next role that
# installs something would fail on "target not found".
- name: Update the pacman cache
  community.general.pacman:
    update_cache: true
  become: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
