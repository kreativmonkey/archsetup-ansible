---
# tasks file for wireguard

- name: Install the wireguard tooling
  community.general.pacman:
    name: wireguard-tools
    state: present
  become: true

# Forwarding is a kernel parameter, and kernel parameters belong to the sysctl
# role — podman sets one too, and two roles writing /etc/sysctl.d is one too
# many.
- name: Enable IPv4 forwarding
  ansible.builtin.include_role:
    name: sysctl
    tasks_from: set
  vars:
    sysctl_setting:
      name: net.ipv4.ip_forward
      value: 1
  when: wireguard_forward_ipv4

- name: Configure the tunnels
  ansible.builtin.include_tasks: __configure/interface.yml
  loop_control:
    loop_var: wireguard_interface
    label: "{{ wireguard_interface.name }}"
  loop: "{{ wireguard_interfaces }}"
