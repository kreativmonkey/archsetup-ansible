---
# One tunnel: its key pair and its config file. Private include, looped from
# main.yml once per entry in wireguard_interfaces.

- name: Create the wireguard configuration directory
  ansible.builtin.file:
    path: "{{ wireguard_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

# `wg genkey` has no state-aware module, so this needs `creates`: the key is
# generated once and then kept, because regenerating it would lock this host out
# of every peer that has the old public key. The key goes straight to disk and
# never through an Ansible variable.
- name: Generate the private key of {{ wireguard_interface.name }}
  ansible.builtin.shell:
    cmd: wg genkey > {{ __wireguard_private_key_file }}
    creates: "{{ __wireguard_private_key_file }}"
    executable: /bin/bash
  become: true
  when: wireguard_interface.private_key is not defined

# A supplied key comes out of a password manager, so it can be anything: the
# wrong field, an empty one, a whole config file pasted in. `wg pubkey` would
# reject it two tasks later with a bare "non-zero return code", censored by
# no_log — this says what is actually wrong, and it says it before the deploy
# below overwrites a key that still works. The assertion prints its own source,
# never the value.
- name: Check the supplied private key of {{ wireguard_interface.name }}
  ansible.builtin.assert:
    that:
      - wireguard_interface.private_key | trim is match('[A-Za-z0-9+/]{43}=$')
    fail_msg: >-
      private_key of {{ wireguard_interface.name }} is not a WireGuard key.
      Expected the 44 base64 characters that `wg genkey` prints; check the field
      the interface definition reads it from.
    quiet: true
  when: wireguard_interface.private_key is defined

# A tunnel whose peer was set up elsewhere brings its own key: only that one
# matches the public key the peer already knows, so a generated one would never
# complete a handshake.
- name: Deploy the private key of {{ wireguard_interface.name }}
  ansible.builtin.copy:
    content: "{{ wireguard_interface.private_key | trim }}\n"
    dest: "{{ __wireguard_private_key_file }}"
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true
  when: wireguard_interface.private_key is defined

- name: Restrict the private key of {{ wireguard_interface.name }}
  ansible.builtin.file:
    path: "{{ __wireguard_private_key_file }}"
    owner: root
    group: root
    mode: "0600"
  become: true

- name: Read the private key of {{ wireguard_interface.name }}
  ansible.builtin.slurp:
    src: "{{ __wireguard_private_key_file }}"
  become: true
  register: __wireguard_private_key_content
  no_log: true

# Derived from the private key on every run rather than written once beside it:
# a public key that outlives the key it belongs to is worse than none, because
# it is the one you hand to the peer.
- name: Derive the public key of {{ wireguard_interface.name }}
  ansible.builtin.command:
    cmd: wg pubkey
    stdin: "{{ __wireguard_private_key_content.content | b64decode | trim }}"
  register: __wireguard_public_key
  changed_when: false
  no_log: true

- name: Write the public key of {{ wireguard_interface.name }}
  ansible.builtin.copy:
    content: "{{ __wireguard_public_key.stdout | trim }}\n"
    dest: "{{ __wireguard_public_key_file }}"
    owner: root
    group: root
    mode: "0600"
  become: true

- name: Write the configuration for {{ wireguard_interface.name }}
  ansible.builtin.template:
    src: interface.conf.j2
    dest: "{{ wireguard_config_dir }}/{{ wireguard_interface.name }}.conf"
    owner: root
    group: root
    mode: "0600"
  become: true
  register: __wireguard_config
  no_log: true
  vars:
    __wireguard_private_key: >-
      {{ __wireguard_private_key_content.content | b64decode | trim }}

# Handing the tunnel to systemd is opt-in per interface: without `enabled` the
# role writes the config and stops there, and bringing the tunnel up stays a
# decision per boot.
- name: Let systemd own {{ wireguard_interface.name }}
  when: wireguard_interface.enabled | default(false)
  become: true
  block:
    - name: Look for an existing interface named {{ wireguard_interface.name }}
      ansible.builtin.command:
        cmd: ip link show {{ wireguard_interface.name }}
      register: __wireguard_link
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Read the unit state of {{ wireguard_interface.name }}
      ansible.builtin.systemd_service:
        name: "{{ __wireguard_unit }}"
      register: __wireguard_unit_state
      check_mode: false

    # An interface that is up while its unit is not is one somebody started by
    # hand — which is what this role told you to do until `enabled` existed.
    # systemd runs no ExecStop for a unit that is inactive or failed, so a
    # restart would go straight to `wg-quick up` and die on "already exists".
    - name: Release the hand-started interface {{ wireguard_interface.name }}
      ansible.builtin.command:
        cmd: wg-quick down {{ wireguard_interface.name }}
      changed_when: true
      when:
        - __wireguard_link.rc == 0
        - __wireguard_unit_state.status.ActiveState != 'active'

    # Restarted only on a config change: the config carries the private key and
    # the peers, so a change there means the running tunnel is stale — and an
    # unconditional restart would drop every connection through it on every run.
    - name: Enable and start {{ wireguard_interface.name }}
      ansible.builtin.systemd_service:
        name: "{{ __wireguard_unit }}"
        enabled: true
        state: "{{ 'restarted' if __wireguard_config is changed else 'started' }}"
