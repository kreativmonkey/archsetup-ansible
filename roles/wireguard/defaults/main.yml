---
# defaults file for wireguard

# Tunnels to configure, one config file each. Empty by default on purpose: an
# interface definition is host data, so it belongs in the inventory, and every
# identifying or secret value in it should come from a lookup rather than from
# a literal in this repository.
#
# See README.md for the shape and for a Bitwarden-backed example.
wireguard_interfaces: []

# Where the config and the key pairs live. Root only, 0600.
wireguard_config_dir: /etc/wireguard

# Enable IPv4 forwarding. Needed when this host routes for its peers, i.e. runs
# as a server or an exit node. A plain client does not need it.
wireguard_forward_ipv4: false
