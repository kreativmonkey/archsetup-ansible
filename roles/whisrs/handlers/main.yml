---
# handlers file for whisrs
#
# The udev reload is not here: the udev role owns its rules and its handlers,
# and `notify: Reload udev` from tasks/add_rule.yml fires there.
- name: Restart whisrs
  ansible.builtin.systemd_service:
    name: whisrs.service
    scope: user
    state: restarted
    daemon_reload: true
  become: true
  become_user: "{{ whisrs_user }}"
