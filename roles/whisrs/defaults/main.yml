---
# defaults file for whisrs

# User whisrs is installed and run for. It is a user service: the hotkey and
# the typing both need the graphical session.
whisrs_user: "{{ system_users[0].name }}"

# Transcription language and whisper.cpp model. The role downloads
# ggml-<model>.bin from Hugging Face and points whisrs at that file. Bigger is
# more accurate and slower; "small" buys noticeably better German at 488 MB
# instead of 148 MB. The ".en" variants are English-only.
whisrs_language: de
whisrs_model: base

# Transcription backend. local-whisper keeps the audio on this machine.
whisrs_backend: local-whisper

# Desktop notification when a transcription starts and finishes.
whisrs_notify: true

# Hotkey that toggles dictation. Evaluated by whisrs itself through evdev,
# which is why the user has to be in the input group. whisrs parses the last
# element as the trigger key, so modifiers alone ("Super+Ctrl") do not work —
# it has to be modifier(s) plus a key.
whisrs_hotkey: "Super+Shift+W"
