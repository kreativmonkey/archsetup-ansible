---
# Accounts of this host. Consumed by the system_user role and, through
# system_users[0].name, as the default target user of most other roles.
system_users:
  - name: sebastian
    group: sebastian
    groups:
      - name: cups
    # /usr/bin/fish, not /bin/fish: that is what is in /etc/passwd, and both
    # resolve to the same binary — declaring the other one buys a pointless
    # usermod on the first run.
    shell: /usr/bin/fish
    github: kreativmonkey

# Editor that becomes $EDITOR (editor role) and core.editor (git role). One
# declaration, two consumers.
default_editor: nvim

# --- pacman -----------------------------------------------------------------
pacman_parallel_downloads: 10

# --- podman -----------------------------------------------------------------
podman_rootless_users:
  - "{{ system_users[0].name }}"

# --- git --------------------------------------------------------------------
git_identities:
  - folder: gitlab.puzzle.ch
    name: Sebastian Preisner
    email: preisner@puzzle-itc.de
  - folder: github.com
    name: Kreativmonkey
    email: kreativmonkey@calyrium.org
  - folder: git.f4mily.net
    name: Kreativmonkey
    email: kreativmonkey@calyrium.org

git_repositories: []

# --- wireguard --------------------------------------------------------------
# Every identifying value comes from a single Bitwarden item, so nothing about
# the target network lands in this public repository. The item needs these
# custom fields:
#
#   Address  DNS  SearchDomain  PublicKey  PresharedKey  AllowedIPs  Endpoint
wireguard_interfaces: 
  - name: pudelab
    address: "{{ lookup('community.general.bitwarden', 'WireGuard pudelab', field='Address') | first }}"
    dns: "{{ lookup('community.general.bitwarden', 'WireGuard pudelab', field='DNS') | first }}"
    search_domains:
       - "{{ lookup('community.general.bitwarden', 'WireGuard pudelab', field='SearchDomain') | first }}"
    mtu: 1300
    peers:
      - public_key: "{{ lookup('community.general.bitwarden', 'WireGuard pudelab', field='PublicKey') | first }}"
        preshared_key: "{{ lookup('community.general.bitwarden', 'WireGuard pudelab', field='PresharedKey') | first }}"
        allowed_ips: "{{ lookup('community.general.bitwarden', 'WireGuard pudelab', field='AllowedIPs') | first }}"
        endpoint: "{{ lookup('community.general.bitwarden', 'WireGuard pudelab', field='Endpoint') | first }}"
        persistent_keepalive: 25
