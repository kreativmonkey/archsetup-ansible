---
# Orchestration only. Every configuration task lives in a role, and every role
# is runnable on its own: it gathers the facts it needs and raises its own
# privileges per task. That is why there is no `become` and no
# `gather_facts: true` here.
- name: Set up an Arch Linux workstation
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Apply the declared users and groups
      ansible.builtin.import_role:
        name: system_user
      tags:
        - system_user

    - name: Configure pacman and its repositories
      ansible.builtin.import_role:
        name: pacman
      tags:
        - pacman

    - name: Install the base package set
      ansible.builtin.import_role:
        name: common
      tags:
        - common

    # After common, because the build toolchain comes from the official
    # repositories, and before every role that asks for an AUR package.
    - name: Establish AUR access
      ansible.builtin.import_role:
        name: aur
      tags:
        - aur

    - name: Install podman
      ansible.builtin.import_role:
        name: podman
      tags:
        - podman

    - name: Install udev rules
      ansible.builtin.import_role:
        name: udev
      tags:
        - udev

    - name: Establish the firewall policy
      ansible.builtin.import_role:
        name: firewalld
      tags:
        - firewalld

    # Right after firewalld on purpose: that role sets IPv6_rpfilter=no
    # precisely because a WireGuard-style tunnel installs policy routing rules
    # the reverse path filter cannot follow.
    #
    # The tunnel definitions in host_vars resolve their values through
    # Bitwarden, so this play now needs an unlocked vault. Skip it with
    # --skip-tags wireguard when the vault is locked.
    - name: Configure the wireguard tunnels
      ansible.builtin.import_role:
        name: wireguard
      tags:
        - wireguard

    # Same vault caveat as wireguard: the tunnel definitions in host_vars
    # resolve through Bitwarden, so skip this with --skip-tags openvpn when the
    # vault is locked.
    - name: Configure the openvpn split tunnels
      ansible.builtin.import_role:
        name: openvpn
      tags:
        - openvpn

    - name: Install a Neovim distribution
      ansible.builtin.import_role:
        name: vim
      tags:
        - vim

    - name: Install the nix package manager
      ansible.builtin.import_role:
        name: nix
      tags:
        - nix

    - name: Configure direnv
      ansible.builtin.import_role:
        name: direnv
      tags:
        - direnv

    - name: Configure printing
      ansible.builtin.import_role:
        name: cups
      tags:
        - cups

    - name: Configure the keyring and polkit agent
      ansible.builtin.import_role:
        name: gnome_keyring
      tags:
        - gnome_keyring

    - name: Install ollama
      ansible.builtin.import_role:
        name: ollama
      tags:
        - ollama

    - name: Configure opencode
      ansible.builtin.import_role:
        name: opencode
      tags:
        - opencode

    - name: Configure whisrs
      ansible.builtin.import_role:
        name: whisrs
      tags:
        - whisrs

# Roles kept out of this playbook on purpose. Enable one by adding an
# import_role task above:
#   conky editor headroom obs_studio sshd tuxedo
# The sysctl role has no entry here either: it is a central role that podman
# and wireguard call through include_role, it is never imported directly.
